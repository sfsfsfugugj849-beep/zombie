const lib=()=>new Promise((ok,no)=>{if(window.Peer)return ok();const s=D.createElement('script');s.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';s.onload=ok;s.onerror=no;D.head.append(s)});
async function createRoom(){
 show(h('h1',{textContent:'Creando sala…'}));
 try{await lib()}catch(e){alert('No se pudo cargar PeerJS (revisa tu conexión)');return roomMenu()}

  c.on('open',()=>{c.send({k:'hi',nm:S.name});lobby(code)});c.on('data',onData);

  cn.on('open',()=>{cn.send({k:'ch',c:S.sel,nm:S.name});lobby(code)});cn.on('data',onData);

  {style:'background:'+(S.sel==id?'gold':C[id].c)+';color:#000'})));

  host?btn('Jugar',modes,{disabled:!!left}):h('p',{textContent:'Esperando a que el anfitrión inicie…'}))

function begin(){

  else{sp=0;ka=[];IN[0]=i;if(G.st=='run')sim();if(cn&&cn.open&&n%2==0){cn.send({k:'s',g:JSON.stringify(G,rep)});G.v=[]}}

}

function cast(p,k,sl,c,i){
 if(p.mf>0&&sl<2)sl+=8;
 const sk=mine(p).find(s=>s.sl==sl);
 if(!sk||p.s[sl]>0||p.pc>0)return;
 p.s[sl]=sk.cd;
 const dm=c.dm,co=sk.c||c.c,t=sk.t,cs=Math.cos(p.a),sn=Math.sin(p.a);
 const Qe=(x,y,r,d,w,f,o)=>G.q.push({x,y,r,d:d*dm,k,c:co,f,l:Math.max(1,w),...o});
 const aim=(mq=350)=>{const dx=i.mx-p.x,dy=i.my-p.y,q=Math.min(mq,hyp(dx,dy)),a=Math.atan2(dy,dx);return[p.x+Math.cos(a)*q,p.y+Math.sin(a)*q]};
 if(t=='dash'){
  if(sk.org=='rika'){const a=Math.atan2(i.my-p.ry,i.mx-p.rx);p.rx+=Math.cos(a)*sk.dist;p.ry+=Math.sin(a)*sk.dist;
   if(sk.th)Qe(p.rx,p.ry,sk.th.r,sk.th.d,sk.th.w,sk.th.f,{wn:1});fx('tr',p.rx,p.ry,'#ffddff')}
  else{p.ds={vx:cs*sk.dist/8,vy:sn*sk.dist/8,l:8,d:sk.d*dm/8,c:co};
   if(sk.th)Qe(p.x+cs*sk.dist,p.y+sn*sk.dist,sk.th.r,sk.th.d,sk.th.w,sk.th.f,{wn:1})}}
 else if(t=='tp_kick'){
  const [nx, ny] = aim(800);
  fx('ray', p.x, p.y, co, {x: nx, y: ny});
  p.x = clamp(nx, 15, W-15); p.y = clamp(ny, 15, H-15);
  Qe(p.x, p.y, 140, sk.d, 2, 'crater', {wn:0, mk:1});
 }
 else if(t=='light_world'){
  G.p.forEach((ally, idx)=>{
   if(!ally.dead) for(let j=0; j<6; j++) G.al.push({ty:'lw', x:ally.x, y:ally.y, l:300, k, d:sk.d*dm, parent:idx, ang:j*1.047});
  });
  fx('m', p.x, p.y, co);
 }
 else if(t=='aoe'){let x=p.x,y=p.y;
  if(sk.at=='ahead'){x+=cs*75;y+=sn*75}else if(sk.at=='aim')[x,y]=aim();else if(sk.at=='rika'){x=p.rx;y=p.ry}
  (sk.rep||[0]).forEach(w=>Qe(x,y,sk.r,sk.d,w+(sk.w||1),sk.f,{wn:sk.w?1:0,mk:sk.mk,fz:sk.fz}));
  if(sk.hl)p.hp=Math.min(p.mh,p.hp+p.mh*.15)}
 else if(t=='fan'){const o=sk.org=='rika'?[p.rx,p.ry]:[p.x,p.y];fx('w',o[0],o[1],co,p.a);
  for(let j=0;j<sk.cnt;j++){const a=p.a+(j-(sk.cnt-1)/2)*(sk.sp||0);
   G.j.push({x:o[0],y:o[1],vx:Math.cos(a)*sk.s,vy:Math.sin(a)*sk.s,r:sk.r,d:sk.d*dm,l:sk.l,o:0,pi:sk.pi||0,col:co,hs:[],k,ml:sk.ml||0,nl:sk.nl||0,rd:sk.rd||0})}}
 else if(t=='dogs'){for(let j=0;j<2;j++)G.al.push({ty:'d',x:p.x+(j?-26:26),y:p.y,l:480,k,d:dm*1.4});fx('m',p.x,p.y,'#ffffff')}
 else if(t=='blue'){const[x,y]=aim();G.al.push({ty:'b',x,y,l:120,k,d:dm*.8});fx('m',x,y,'#2a7bff')}
 else if(t=='bolts'){const tg=G.e.concat(G.b?[G.b]:[]).filter(e=>hyp(e.x-p.x,e.y-p.y)<480).sort((a,b)=>hyp(a.x-p.x,a.y-p.y)-hyp(b.x-p.x,b.y-p.y)).slice(0,sk.cnt);
  for(let j=0;j<sk.cnt;j++){const e=tg[j];Qe(e?e.x:p.x+cs*(130+j*50),e?e.y:p.y+sn*(130+j*50),60,sk.d,24+j*5,'lt',{wn:1})}}
 else if(t=='heal'){p.hp=Math.min(p.mh,p.hp+p.mh*.3);fx('hl',p.x,p.y,'#7dff9a')}
 else if(t=='dom'){G.dom={l:300,m:300,c:sk.c,tx:sk.tx,p:p.ch,k:k,dm:dm};fx('de',p.x,p.y,sk.c,300)}
 else if(t=='beam'){
  const o=sk.org=='rika'?[p.rx,p.ry]:[p.x,p.y],a=Math.atan2(i.my-o[1],i.mx-o[0]);
  fx('m',o[0],o[1],sk.c);
  // Un solo láser visual continuo de verdad
  fx('beam_fx',o[0],o[1],sk.c,{a:a,L:W*1.5,w:sk.w,l:30});
  // Nodos de daño invisibles (pasamos '' en 'f' para no pintar los circulitos)
  for(let j=1;j<=20;j++) Qe(o[0]+Math.cos(a)*j*60,o[1]+Math.sin(a)*j*60,sk.w,sk.d,15,'',{wn:0});
  shk=Math.max(shk,25);
 }
 else if(t=='shield'){if(sk.org=='rika'){p.rx=p.x;p.ry=p.y;Qe(p.x,p.y,sk.r,3,20,'m',{fz:120});p.hp=Math.min(p.mh,p.hp+p.mh*.2);fx('hl',p.x,p.y,'#ffddff')}}
}
function special(p,k,c){
 const id=p.ch;
 if(id=='yuji'){p.zn=480;p.cs=0;p.sc=900;fx('z',p.x,p.y,'#ff2030')}
 else if(id=='megumi'){p.mf=900;p.an=0;p.ad=[];p.sc=1500;fx('m',p.x,p.y,'#ffd84a')}
 else if(id=='nobara'){const tg=G.e.concat(G.b?[G.b]:[]).filter(t=>t.mk>0);if(!tg.length)return;p.sc=360;
  tg.forEach(t=>{const d=t.mk*c.dm*10;t.hp-=d;t.lk=k;t.mk=0;fx('r',t.x,t.y,c.c,d)})}
 else if(id=='maki'){p.pn=480;p.sc=900;fx('y',p.x,p.y,c.c)}
 else if(id=='gojo'){p.pc=70;p.sc=720;fx('m',p.x,p.y,'#b060ff')}
 else if(id=='yuta'){p.rk=600;p.sc=1200;p.rx=p.x;p.ry=p.y;fx('m',p.x,p.y,'#fff')}
 else if(id=='dabura'){p.da=300;p.sc=720;fx('de',p.x,p.y,c.c,100);fx('hl',p.x,p.y,c.c);}
}
function sim(){
 G.t++;
 if(G.p.every(p=>p.dead)){G.st='over';return}
 G.p.forEach((p,k)=>{
  if(p.dead)return;
  const c=C[p.ch],i=IN[k],d=hyp(i.dx||0,i.dy||0)||1,sp=c.sp*(p.pn>0?1.6:1)*(p.pc>0?.2:1);
  p.x=clamp(p.x+(i.dx||0)/d*sp,15,W-15);p.y=clamp(p.y+(i.dy||0)/d*sp,15,H-15);
  p.a=Math.atan2((i.my||0)-p.y,(i.mx||0)-p.x);p.cd--;p.sc--;p.iv--;p.s=p.s.map(v=>v-1);
  if(p.ds){const q=p.ds;p.x=clamp(p.x+q.vx,15,W-15);p.y=clamp(p.y+q.vy,15,H-15);p.iv=Math.max(p.iv,3);hurt(p.x,p.y,40,q.d,k);fx('tr',p.x,p.y,q.c);if(--q.l<=0)p.ds=0}
  if(p.zn>0)p.zn--;
  if(p.da>0){p.da--;p.iv=Math.max(p.iv,2);}
  if(p.mf>0&&--p.mf==0){p.an=0;p.ad=[]}
  if(p.pn>0){p.pn--;if(p.pn%6==0){hurt(p.x,p.y,100,c.dm*1.6,k);fx('y',p.x,p.y,c.c)}}
  if(p.pc>0&&--p.pc==0){G.j.push({x:p.x,y:p.y,vx:Math.cos(p.a)*24,vy:Math.sin(p.a)*24,r:90,d:1500,l:80,o:0,pi:1,col:'#b060ff',hs:[],k,ml:0,nl:0,pp:1});fx('s',p.x,p.y,'#b060ff',300);p.x-=Math.cos(p.a)*40;p.y-=Math.sin(p.a)*40}
  if(p.rk>0){p.rk--;let t=null,m=350;G.e.concat(G.b?[G.b]:[]).forEach(e=>{const q=hyp(e.x-p.x,e.y-p.y);if(q<m){m=q;t=e}});
   p.rx+=((t?t.x:p.x-45)-p.rx)*.12;p.ry+=((t?t.y:p.y)-p.ry)*.12;
   if(p.rk%15==0){hurt(p.rx,p.ry,80,c.dm*2.8,k);fx('y',p.rx,p.ry,'#ffccff')}}
  if(i.f&&p.cd<=0&&!(p.pc>0)){const mh=p.mf>0,m=c.m||mh;p.cd=mh?13:c.cd;fx('w',p.x,p.y,mh?'#ffd84a':c.c,p.a);const s=m?10:12;
   let dm_m=c.dm*(mh?3:1)*(p.rk>0?2:1)*(p.da>0?2:1),col=mh?'#ffd84a':c.c;
   if(p.zn>0){if(rnd()<.4+p.cs*.2){p.cs++;dm_m*=8;col='#ff2030';fx('bf',p.x+Math.cos(p.a)*45,p.y+Math.sin(p.a)*45,col)}else p.cs=0}
   G.j.push({x:p.x+Math.cos(p.a)*15,y:p.y+Math.sin(p.a)*15,vx:Math.cos(p.a)*s,vy:Math.sin(p.a)*s,r:m?(mh?46:32):8,d:dm_m,l:m?5:65,o:0,pi:m||c.pi||0,col,hs:[],k,ml:m?1:0,nl:p.ch=='nobara'?1:0})}
  if(i.s&&p.sc<=0)special(p,k,c);
  (i.a||[]).forEach(sl=>cast(p,k,sl,c,i));i.a=[];
  i.s=0
 });
 // oleadas
 if(gm=='s'&&!G.e.length&&--G.nw<=0){
  G.p.forEach(p=>{if(!p.dead){p.c+=G.w*5;p.hp=Math.min(p.mh,p.hp+p.mh*.25)}});
  G.w++;G.nw=120;
  const n=Math.min(4+G.w*2,45);
  for(let k=0;k<n;k++){const bg=G.w%5==0&&k<G.w/5,a=rnd()*6.283;
   G.e.push({id:++G.id,x:W/2+Math.cos(a)*600,y:H/2+Math.sin(a)*500,hp:bg?650+G.w*70:30+G.w*10,r:bg?28:14,
    sp:bg?.95:Math.min(1+rnd()*.6+G.w*.03,2.8),d:bg?28:10+G.w/2,v:bg?30:2+(G.w/3|0),t:bg?1:0})}
 }
 G.e.forEach(e=>{const t=near(e);if(!t)return;if(e.fz>0){e.fz--;return}const a=Math.atan2(t.y-e.y,t.x-e.x);
  e.x+=Math.cos(a)*e.sp;e.y+=Math.sin(a)*e.sp;
  if(t.iv<=0&&hyp(t.x-e.x,t.y-e.y)<e.r+15)harm(t,e.d,e.t?'g':'c')});
 G.q.forEach(e=>{if(--e.l>0)return;
  if(e.mk)G.e.forEach(n=>{if(n.mk&&hyp(n.x-e.x,n.y-e.y)<e.r+n.r){n.hp-=n.mk*e.d*.6;n.lk=e.k;n.mk=0}});
  hurt(e.x,e.y,e.r,e.d,e.k);
  if(e.fz)G.e.forEach(n=>{if(hyp(n.x-e.x,n.y-e.y)<e.r+n.r)n.fz=e.fz});
  if(e.f!=='') fx(e.f||'y',e.x,e.y,e.c,e.r);
 });
 G.q=G.q.filter(e=>e.l>0);
 G.al.forEach(a=>{a.l--;
  if(a.ty=='d'){let t=null,m=1e9;G.e.concat(G.b?[G.b]:[]).forEach(e=>{const q=hyp(e.x-a.x,e.y-a.y);if(q<m){m=q;t=e}});
   const o=t||G.p[a.k],an=Math.atan2(o.y-a.y,o.x-a.x);
   if(m>35||!t){a.x+=Math.cos(an)*5;a.y+=Math.sin(an)*5}
   if(t&&m<(t.r||50)+38&&a.l%12==0){hurt(a.x,a.y,38,a.d,a.k);fx('y',a.x,a.y,'#ffffff')}
  }
  else if(a.ty=='b'){G.e.forEach(n=>{const q=hyp(a.x-n.x,a.y-n.y);if(q<240&&q>8){n.x+=(a.x-n.x)/q*5;n.y+=(a.y-n.y)/q*5}});
   if(a.l%10==0){hurt(a.x,a.y,60,a.d,a.k);fx('y',a.x,a.y,'#4aa8ff')}
  }
  else if(a.ty=='lw'){
   let t=null, m=350;
   G.e.concat(G.b?[G.b]:[]).forEach(e=>{const q=hyp(e.x-a.x,e.y-a.y); if(q<m){m=q;t=e}});
   if (t && m<400) {
    const an=Math.atan2(t.y-a.y, t.x-a.x);
    a.x+=Math.cos(an)*10; a.y+=Math.sin(an)*10;
    if(m < (t.r||50)+20) a.l=1;
   } else {
    a.ang+=0.07;
    const par = G.p[a.parent];
    if (par && !par.dead) {
     const tx = par.x + Math.cos(a.ang)*65, ty = par.y + Math.sin(a.ang)*65;
     a.x += (tx - a.x)*0.2; a.y += (ty - a.y)*0.2;
    }
   }
   if(a.l%4==0) pr(a.x, a.y, rnd()*6.28, 1.5, 12, 5, '#ffffcc', 1); // sparks trailing
   if(a.l<=1) { hurt(a.x, a.y, 100, a.d, a.k); fx('x', a.x, a.y, '#ffffaa', 100); }
  }
 });
 G.al=G.al.filter(a=>a.l>0);
 // jefe: Sukuna (Heian)
 const b=G.b;
 if(b){
  if(b.hp<=0){G.st='win';fx('B',b.x,b.y,'#f34');G.p.forEach(p=>p.c+=1500);return}
  const t=near(b);b.t--;
  if(t){const a=Math.atan2(t.y-b.y,t.x-b.x);b.x+=Math.cos(a)*.85;b.y+=Math.sin(a)*.85;
   if(t.iv<=0&&hyp(t.x-b.x,t.y-b.y)<66)harm(t,35,'b');
   if(b.t<=0){b.t=b.hp<b.mh/2?65:90;const m=rnd()*3|0;fx('c',b.x,b.y,'#f34');
    if(m==0)fan(b,a,3,.25);
    else if(m==1)G.p.forEach(p=>!p.dead&&G.h.push({x:p.x,y:p.y,r:95,l:50,m:50,d:45}));
    else if(b.hp<b.mh/2)for(let k=0;k<8;k++)G.h.push({x:rnd()*W,y:rnd()*H,r:85,l:65,m:65,d:40}); // Santuario Malévolo
    else fan(b,a,5,.35)}}
 }
 G.h.forEach(z=>{if(--z.l==0){G.f.push({x:z.x,y:z.y,r:z.r,l:14,col:'#ff3344'});fx('x',z.x,z.y,'#f33',z.r);
  G.p.forEach(p=>{if(!p.dead&&p.iv<=0&&hyp(p.x-z.x,p.y-z.y)<z.r)harm(p,z.d,'x')})}});
 G.h=G.h.filter(z=>z.l>0);
 // proyectiles
 G.j.forEach(j=>{j.x+=j.vx;j.y+=j.vy;j.l--;
  if(rnd()<.5&&!j.ml)pr(j.x+(rnd()-.5)*12,j.y+(rnd()-.5)*12,0,0,12,j.r*.6,j.col, 1);
  if(j.pp){bu(j.x,j.y,5,12,20,3,'#b060ff');shk=Math.max(shk,4)} // rastro Púrpura
  if(j.o==0){
   G.e.forEach(e=>{if(j.l>0&&!j.hs.includes(e.id)&&hyp(e.x-j.x,e.y-j.y)<e.r+j.r){hit(e,j.d,j.k);if(j.nl)e.mk=Math.min(10,(e.mk||0)+1);j.hs.push(e.id);if(!j.pi)j.l=0}});
   if(b&&j.l>0&&!j.hs.includes('b')&&hyp(b.x-j.x,b.y-j.y)<50+j.r){b.hp-=j.d;if(j.nl)b.mk=Math.min(10,(b.mk||0)+1);fx('h',j.x,j.y,'#ff6070',j.d);j.hs.push('b');if(!j.pi)j.l=0}
  }else G.p.forEach(p=>{if(j.l>0&&!p.dead&&p.iv<=0&&hyp(p.x-j.x,p.y-j.y)<15+j.r){harm(p,j.d,'j');j.l=0}})});
 G.j.forEach(j=>{if(j.rd&&j.l<=0&&!j.ex){j.ex=1;hurt(j.x,j.y,140,j.d,j.k);
  G.e.forEach(n=>{const a=Math.atan2(n.y-j.y,n.x-j.x);if(hyp(n.x-j.x,n.y-j.y)<160){n.x+=Math.cos(a)*80;n.y+=Math.sin(a)*80}});fx('rd',j.x,j.y,'#ff3040',140)}});
 G.j=G.j.filter(j=>j.l>0&&j.x>-30&&j.x<W+30&&j.y>-30&&j.y<H+30);
 G.e=G.e.filter(e=>{if(e.hp>0)return 1;fx('k',e.x,e.y,e.t?'#d070ff':'#9a5ff0');if(e.lk!=null)G.p[e.lk].c+=e.v;return 0});
 G.f.forEach(f=>f.l--);G.f=G.f.filter(f=>f.l>0);

 if(G.dom){
  G.dom.l--;
  if(G.dom.p=='gojo'){G.e.forEach(e=>{e.fz=15;hurt(e.x,e.y,e.r,G.dom.dm*.3,G.dom.k)});if(b)b.hp-=G.dom.dm*.3}
  else if(G.dom.p=='yuta'){if(G.dom.l%12==0)for(let i=0;i<4;i++){let rx=rnd()*W,ry=rnd()*H;hurt(rx,ry,110,G.dom.dm*4,G.dom.k);fx('sl',rx,ry,'#fff',110)}}
