<script>
(()=>{
const D=document,W=900,H=560,hyp=Math.hypot,rnd=Math.random,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
D.getElementById('jjk')?.remove();
let S={coins:0,own:['yuji'],sel:'yuji'};
try{Object.assign(S,JSON.parse(localStorage.jjk))}catch(e){}
const save=()=>{try{localStorage.jjk=JSON.stringify(S)}catch(e){}};
// m:1 = cuerpo a cuerpo, pi = atraviesa enemigos, sd/sr = daño/radio del especial
const C={
yuji:{n:'Yuji Itadori',c:'#ff7a9c',hp:130,sp:3.3,dm:14,cd:14,m:1,sk:'Zona · Black Flash',ds:'Entras en la Zona 8s: tus golpes pueden ser Black Flash (x7) y cada uno seguido sube la probabilidad.',p:0},
megumi:{n:'Megumi Fushiguro',c:'#5a7bff',hp:110,sp:3.2,dm:12,cd:11,sk:'Invocar a Mahoraga',ds:'Te conviertes en Mahoraga 15s. Cada golpe recibido reduce 1% más el siguiente; ante un ataque nuevo el contador baja a la mitad.',p:400},
nobara:{n:'Nobara Kugisaki',c:'#ff9a3c',hp:100,sp:3.2,dm:9,cd:7,sk:'Resonancia',ds:'Tus clavos marcan enemigos; Resonancia daña a todos los marcados según los clavos clavados.',p:600},
maki:{n:'Maki Zenin',c:'#3ccf7a',hp:150,sp:3.8,dm:24,cd:16,m:1,sk:'Nube Juguetona',ds:'8s: giras tu bastón cortando todo a tu alrededor y te mueves más rápido.',p:1000},
gojo:{n:'Satoru Gojo',c:'#7fd8ff',hp:140,sp:3.6,dm:18,cd:9,pi:1,sk:'Púrpura Hueco',ds:'Infinito pasivo: inmune a proyectiles. Carga 1s invulnerable y dispara un rayo que lo atraviesa todo.',p:3000},
yuta:{n:'Yuta Okkotsu',c:'#e8e8ff',hp:150,sp:3.6,dm:26,cd:10,pi:1,sk:'Rika',ds:'Invocas a Rika 10s: ataca sola a los enemigos cercanos y potencia tus golpes x1.5.',p:5000}
};
const st=D.createElement('style');
st.textContent=`#jjk{position:fixed;inset:0;background:#0d0817;color:#ece6ff;font:15px Georgia,serif;z-index:99999;display:flex;flex-direction:column;align-items:center;overflow:auto;text-align:center}
#jjk h1{margin:14px 0 6px;font-size:34px;letter-spacing:4px;color:#d5b8ff}
#jjk button{background:#4c1fb8;color:#fff;border:0;border-radius:6px;padding:10px 24px;margin:5px;font:17px Georgia,serif;cursor:pointer}
#jjk button:hover{background:#7240ee}
#jjk .g{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:1000px;padding:6px}
#jjk .cd{width:190px;padding:10px;border:2px solid;border-radius:6px;background:#160d29}
#jjk .bt{position:sticky;bottom:0;width:100%;margin-top:auto;background:#0d0817;padding:8px 0;border-top:1px solid #2b1a52}
#jjk input{padding:10px;font:24px Georgia,serif;text-align:center;text-transform:uppercase;width:160px;border-radius:6px;border:0}
#jjk canvas{width:min(100vw,160vh);height:auto;margin:auto;background:#120a22}`;
D.head.append(st);
const R=D.createElement('div');R.id='jjk';D.body.append(R);
const h=(t,a={},...k)=>{const e=D.createElement(t);Object.assign(e,a);e.append(...k);return e};
const btn=(t,f,a)=>h('button',{textContent:t,onclick:f,...a});
const show=(...k)=>R.replaceChildren(...k);
let P,cn,host=0,me=0,gm='s',G,gc='yuji',loop;const IN=[{},{}];
const O=(x,a,b,r)=>{x.beginPath();x.arc(a,b,r,0,7);x.fill()};
const rep=(k,v)=>k=='hs'?undefined:typeof v=='number'?Math.round(v*10)/10:v;
const PT=[],TX=[],RG=[];let shk=0,fl=0,fc='#fff',lw=0,ban=0;
const pr=(x,y,a,s,l,r,c)=>PT.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l,m:l,r,c});
const bu=(x,y,n,s,l,r,c)=>{for(let i=0;i<n;i++)pr(x,y,rnd()*6.283,s*(.2+rnd()*.8),l*(.5+rnd()*.7),r*(.5+rnd()),c)};
const rg=(x,y,R,l,c,w)=>RG.push({x,y,R,l,m:l,c,w});
const gl=(x,a,b,r,c,al)=>{const g=x.createRadialGradient(a,b,0,a,b,r);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');x.globalAlpha=al;x.fillStyle=g;x.fillRect(a-r,b-r,r*2,r*2);x.globalAlpha=1};
const sw=(A,f)=>{for(let i=A.length;i--;){f(A[i]);if(A[i].l<=0)A.splice(i,1)}};
function spawn(t,x,y,c,v){
 if(PT.length>1200)return;
 if(t=='h'){bu(x,y,7,5,18,3,c);bu(x,y,4,6,12,2,'#fff');TX.push({x:x+rnd()*24-12,y:y-14,t:v|0,l:34,c:'#fff'})}
 else if(t=='k'){bu(x,y,26,7,30,4,c);bu(x,y,10,9,22,2.5,'#ffd84a');rg(x,y,40,16,c,3)}
 else if(t=='w'){for(let i=0;i<5;i++)pr(x,y,v+(rnd()-.5)*.6,4+rnd()*5,10,2.5,c)}
 else if(t=='s'){rg(x,y,v,22,c,8);rg(x,y,v*.6,16,'#fff',4);rg(x,y,v*1.25,30,c,3);bu(x,y,70,v/9,40,4,c);bu(x,y,30,v/6,30,3,'#fff');shk=Math.max(shk,6+v/30);fl=Math.max(fl,.25+v/1500);fc=c}
 else if(t=='x'){rg(x,y,v,18,'#ff5030',7);bu(x,y,40,v/9,32,5,'#ff7a30');bu(x,y,20,v/7,24,3,'#ffd060');shk=Math.max(shk,7)}
 else if(t=='p'){bu(x,y,16,6,24,3.5,'#ff3040');shk=Math.max(shk,6);fl=Math.max(fl,.22);fc='#f00'}
 else if(t=='c'){rg(x,y,90,18,'#ff3344',3);bu(x,y,14,3,26,3,'#ff3344');shk=Math.max(shk,3)}
 else if(t=='z'){rg(x,y,70,20,c,4);bu(x,y,30,6,28,3,c);shk=Math.max(shk,4);fl=Math.max(fl,.25);fc='#200008'}
 else if(t=='bf'){rg(x,y,80,16,c,9);rg(x,y,40,12,'#fff',4);bu(x,y,40,12,24,3,c);bu(x,y,20,14,18,2,'#fff');shk=Math.max(shk,12);fl=Math.max(fl,.45);fc=c}
 else if(t=='m'){rg(x,y,120,26,c,8);rg(x,y,70,20,'#fff',4);bu(x,y,60,8,40,4,c);shk=Math.max(shk,8);fl=Math.max(fl,.35);fc=c}
 else if(t=='a'){rg(x,y,70,16,c,5);bu(x,y,20,5,22,3,c);fl=Math.max(fl,.12);fc=c}
 else if(t=='r'){rg(x,y,50,16,c,5);bu(x,y,24,7,26,3.5,c);TX.push({x,y:y-18,t:v|0,l:40,c:'#ff9a3c'});shk=Math.max(shk,3)}
 else if(t=='y'){bu(x,y,12,6,16,3,c);rg(x,y,55,10,c,3);shk=Math.max(shk,1.5)}
 else if(t=='i'){rg(x,y,42,14,c,3);bu(x,y,8,3,14,2,c)}
 else if(t=='B'){for(let i=0;i<8;i++)setTimeout(()=>{bu(x+rnd()*80-40,y+rnd()*80-40,60,12,50,6,i%2?'#ff3344':'#ffd060');rg(x,y,60+i*40,30,i%2?'#ff3344':'#fff',6);shk=30;fl=1;fc='#fff'},i*180)}
}
function fx(t,x,y,c,v){spawn(t,x,y,c,v);if(cn&&G&&G.v.length<200)G.v.push([t,x|0,y|0,c,v&&Math.round(v*10)/10])}
function upd(){
 const T=G.t,b=G.b;
 sw(PT,p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.94;p.vy*=.94;p.l--});sw(RG,r=>r.l--);sw(TX,t=>t.l--);
 shk*=.88;fl*=.9;if(ban>0)ban--;
 G.j.forEach(j=>{if(!j.ml)pr(j.x,j.y,0,0,12,j.r*.7,j.col)});
 G.p.forEach(p=>{if(!p.dead&&T%3==0)pr(p.x+rnd()*14-7,p.y+rnd()*14-7,-1.57,.8,22,2.5,C[p.ch].c)});
 G.e.forEach(e=>{if(rnd()<.08)pr(e.x,e.y,rnd()*6.28,.6,26,e.r*.4,e.t?'#b030ff':'#5a2a9a')});
 if(b&&rnd()<.7)pr(b.x+(rnd()-.5)*90,b.y+(rnd()-.5)*60,-1.57,1+rnd()*1.5,40,2+rnd()*2,rnd()<.5?'#ff3344':'#ff9a30');
 if(G.w!=lw){lw=G.w;if(lw){ban=100;fl=Math.max(fl,.3);fc='#a060ff'}}
}


function menu(){
 onkeydown=onkeyup=onmouseup=null;
 const g=h('div',{className:'g'});
 for(const id in C){const c=C[id],o=S.own.includes(id);
  g.append(h('div',{className:'cd',style:'border-color:'+(S.sel==id?'gold':c.c)},
   h('b',{textContent:c.n,style:'color:'+c.c}),h('div',{textContent:`❤${c.hp}  ⚔${c.dm}  ⚡${c.sp}`}),h('small',{textContent:c.sk+': '+c.ds,style:'font-size:12px;display:block'}),h('br'),
   btn(o?(S.sel==id?'Elegido':'Elegir'):'Comprar 🪙'+c.p,()=>{
    if(o)S.sel=id;else if(S.coins>=c.p){S.coins-=c.p;S.own.push(id);S.sel=id}else return alert('Monedas insuficientes');
    save();menu()})))}
 show(h('h1',{textContent:'JUJUTSU KAISEN'}),h('div',{textContent:'🪙 '+S.coins}),g,
  h('div',{className:'bt'},btn('Jugar',solo),btn('Crear sala',roomMenu)))
}
function roomMenu(){show(h('h1',{textContent:'Sala'}),btn('Unirte a sala',joinMenu),btn('Crear sala',createRoom),h('br'),btn('← Volver',menu))}
function joinMenu(){const i=h('input',{maxLength:5,placeholder:'CÓDIGO'});
 show(h('h1',{textContent:'Unirte a sala'}),i,h('br'),btn('Unirse',()=>join(i.value.trim().toUpperCase())),h('br'),btn('← Volver',roomMenu))}
const lib=()=>new Promise((ok,no)=>{if(window.Peer)return ok();const s=D.createElement('script');s.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';s.onload=ok;s.onerror=no;D.head.append(s)});
async function createRoom(){
 show(h('h1',{textContent:'Creando sala…'}));
 try{await lib()}catch(e){alert('No se pudo cargar PeerJS (revisa tu conexión)');return roomMenu()}
 const code=rnd().toString(36).slice(2,7).toUpperCase();
 P=new Peer('jjk'+code);host=1;me=0;
 P.on('error',e=>{alert('Error de sala: '+e.type);roomMenu()});
 P.on('connection',c=>{if(cn&&cn.open)return c.close();cn=c;
  c.on('open',()=>lobby(code));c.on('data',onData);
  c.on('close',()=>{if(!G)lobby(code,1);else if(G.p[1])G.p[1].dead=1})});
 show(h('h1',{textContent:'Código: '+code}),h('p',{textContent:'Pásaselo al otro jugador. Esperando…'}),btn('Cancelar',quit))
}
async function join(code){
 if(code.length<3)return;
 show(h('h1',{textContent:'Conectando…'}));
 try{await lib()}catch(e){alert('No se pudo cargar PeerJS (revisa tu conexión)');return roomMenu()}
 P=new Peer();host=0;me=1;
 P.on('error',e=>{alert('No se pudo unir: '+e.type);roomMenu()});
 P.on('open',()=>{cn=P.connect('jjk'+code);
  cn.on('open',()=>{cn.send({k:'ch',c:S.sel});lobby(code)});cn.on('data',onData);
  cn.on('close',()=>{if(G&&G.st=='run')alert('El anfitrión salió');quit()})})
}
function lobby(code,left){
 const g=h('div',{className:'g'},...S.own.map(id=>btn(C[id].n,()=>{S.sel=id;save();cn&&cn.send({k:'ch',c:id});lobby(code,left)},
  {style:'background:'+(S.sel==id?'gold':C[id].c)+';color:#000'})));
 show(h('h1',{textContent:'Sala '+code}),h('p',{textContent:left?'El otro jugador salió':'Jugador 2 conectado'}),h('p',{textContent:'Elige tu personaje:'}),g,
  host?btn('Jugar',modes,{disabled:!!left}):h('p',{textContent:'Esperando a que el anfitrión inicie…'}))
}
function modes(){show(h('h1',{textContent:'Modo de juego'}),btn('Survival',()=>go('s')),btn('Boss',()=>go('b')),h('br'),btn('← Volver',()=>lobby('',0)))}
function go(m){cn.send({k:'go',m,c:[S.sel,gc]});start(m,[S.sel,gc])}
function onData(d){
 if(d.k=='ch')gc=d.c;
 else if(d.k=='in')IN[1]=d.i;
 else if(d.k=='go'){gm=d.m;G=null;begin()}
 else if(d.k=='s'){G=JSON.parse(d.g);(G.v||[]).forEach(v=>spawn(...v))}
}
function solo(){try{P&&P.destroy()}catch(e){}P=cn=null;host=me=0;start('s')}
function start(m,chs=[S.sel]){
 gm=m;
 G={p:chs.map((c,i)=>({x:300+i*80,y:H/2,hp:C[c].hp,mh:C[c].hp,ch:c,c:0,cd:0,sc:0,iv:0,dead:0,a:0,zn:0,cs:0,mf:0,an:0,ad:[],pn:0,pc:0,rk:0,rx:0,ry:0})),e:[],j:[],h:[],f:[],w:0,st:'run',t:0,nw:60,id:0,v:[]};
 if(m=='b')G.b={x:700,y:H/2,hp:40000,mh:40000,t:120};
 begin()
}
function begin(){
 const cv=h('canvas',{width:W,height:H}),x=cv.getContext('2d'),K={};
 let mx=W/2,my=H/2,fi=0,sp=0,n=0,ended=0;
 show(cv);PT.length=TX.length=RG.length=0;lw=0;ban=gm=='b'?140:0;
 onkeydown=e=>{K[e.code]=1;if(e.code=='Space'){sp=1;e.preventDefault()}};
 onkeyup=e=>K[e.code]=0;
 onmouseup=()=>fi=0;
 cv.onmousedown=e=>{e.button?sp=1:fi=1};
 cv.oncontextmenu=e=>e.preventDefault();
 cv.onmousemove=e=>{const r=cv.getBoundingClientRect();mx=(e.clientX-r.left)*W/r.width;my=(e.clientY-r.top)*H/r.height};
 cancelAnimationFrame(loop);
 const tick=()=>{
  loop=requestAnimationFrame(tick);n++;
  const i={dx:(K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0),dy:(K.KeyS||K.ArrowDown?1:0)-(K.KeyW||K.ArrowUp?1:0),mx,my,f:fi,s:sp};
  if(me){if(n%2==0&&cn.open){cn.send({k:'in',i});sp=0}}
  else{sp=0;IN[0]=i;if(G.st=='run')sim();if(cn&&cn.open&&n%2==0){cn.send({k:'s',g:JSON.stringify(G,rep)});G.v=[]}}
  if(G){upd();draw(x);if(G.st!='run'&&!ended){ended=1;fin()}}
 };
 tick()
}
const near=o=>{let t=null,m=1e9;G.p.forEach(p=>{if(p.dead)return;const d=hyp(p.x-o.x,p.y-o.y);if(d<m){m=d;t=p}});return t};
const hit=(e,d,k)=>{e.hp-=d;e.lk=k;fx('h',e.x,e.y,'#cfa8ff',d)};
const harm=(p,d,ty)=>{
 if(p.pc>0||(p.ch=='gojo'&&ty=='j')){fx('i',p.x,p.y,'#7fd8ff');p.iv=10;return}
 if(p.mf>0){if(!p.ad.includes(ty)){p.ad.push(ty);p.an=Math.floor(p.an/2);fx('a',p.x,p.y,'#ffd84a')}
  d*=1-Math.min(.9,p.an/100);p.an++}
 p.hp-=d;p.iv=40;fx('p',p.x,p.y,'#f33');if(p.hp<=0)p.dead=1};
function hurt(x,y,r,d,k){
 G.e.forEach(e=>hyp(e.x-x,e.y-y)<r+e.r&&hit(e,d,k));
 const b=G.b;if(b&&hyp(b.x-x,b.y-y)<r+50)b.hp-=d
}
function fan(b,a,n,s){for(let k=-n;k<=n;k++)G.j.push({x:b.x,y:b.y,vx:Math.cos(a+k*s)*5,vy:Math.sin(a+k*s)*5,r:10,d:18,l:150,o:1,col:'#ff3344',hs:[]})}
function special(p,k,c){
 const id=p.ch;
 if(id=='yuji'){p.zn=480;p.cs=0;p.sc=900;fx('z',p.x,p.y,'#ff2030')}
 else if(id=='megumi'){p.mf=900;p.an=0;p.ad=[];p.sc=1500;fx('m',p.x,p.y,'#ffd84a')}
 else if(id=='nobara'){const tg=G.e.concat(G.b?[G.b]:[]).filter(t=>t.mk>0);if(!tg.length)return;p.sc=300;
  tg.forEach(t=>{const d=t.mk*c.dm*8;t.hp-=d;t.lk=k;t.mk=0;fx('r',t.x,t.y,c.c,d)})}
 else if(id=='maki'){p.pn=480;p.sc=900;fx('y',p.x,p.y,c.c)}
 else if(id=='gojo'){p.pc=70;p.sc=600;fx('m',p.x,p.y,'#4080ff')}
 else if(id=='yuta'){p.rk=600;p.sc=1100;p.rx=p.x;p.ry=p.y;fx('m',p.x,p.y,'#fff')}
}
function sim(){
 G.t++;
 if(G.p.every(p=>p.dead)){G.st='over';return}
 G.p.forEach((p,k)=>{
  if(p.dead)return;
  const c=C[p.ch],i=IN[k],d=hyp(i.dx||0,i.dy||0)||1,sp=c.sp*(p.pn>0?1.4:1)*(p.pc>0?.2:1);
  p.x=clamp(p.x+(i.dx||0)/d*sp,15,W-15);p.y=clamp(p.y+(i.dy||0)/d*sp,15,H-15);
  p.a=Math.atan2((i.my||0)-p.y,(i.mx||0)-p.x);p.cd--;p.sc--;p.iv--;
  if(p.zn>0)p.zn--;
  if(p.mf>0&&--p.mf==0){p.an=0;p.ad=[]}
  if(p.pn>0){p.pn--;if(p.pn%8==0){hurt(p.x,p.y,85,c.dm*1.5,k);fx('y',p.x,p.y,c.c)}}
  if(p.pc>0&&--p.pc==0){G.j.push({x:p.x,y:p.y,vx:Math.cos(p.a)*14,vy:Math.sin(p.a)*14,r:60,d:700,l:70,o:0,pi:1,col:'#b060ff',hs:[],k,ml:0,nl:0,pp:1});fx('s',p.x,p.y,'#b060ff',200)}
  if(p.rk>0){p.rk--;let t=null,m=300;G.e.concat(G.b?[G.b]:[]).forEach(e=>{const q=hyp(e.x-p.x,e.y-p.y);if(q<m){m=q;t=e}});
   p.rx+=((t?t.x:p.x-40)-p.rx)*.1;p.ry+=((t?t.y:p.y)-p.ry)*.1;
   if(p.rk%15==0){hurt(p.rx,p.ry,75,c.dm*2.5,k);fx('y',p.rx,p.ry,'#fff')}}
  if(i.f&&p.cd<=0&&!(p.pc>0)){const mh=p.mf>0,m=c.m||mh;p.cd=mh?14:c.cd;fx('w',p.x,p.y,mh?'#ffd84a':c.c,p.a);const s=m?9:11;
   let d=c.dm*(mh?3:1)*(p.rk>0?1.5:1),col=mh?'#ffd84a':c.c;
   if(p.zn>0){if(rnd()<.3+p.cs*.15){p.cs++;d*=7;col='#ff2030';fx('bf',p.x+Math.cos(p.a)*40,p.y+Math.sin(p.a)*40,col)}else p.cs=0}
   G.j.push({x:p.x+Math.cos(p.a)*14,y:p.y+Math.sin(p.a)*14,vx:Math.cos(p.a)*s,vy:Math.sin(p.a)*s,r:m?(mh?44:30):7,d,l:m?5:60,o:0,pi:m||c.pi||0,col,hs:[],k,ml:m?1:0,nl:p.ch=='nobara'?1:0})}
  if(i.s&&p.sc<=0)special(p,k,c);
  i.s=0
 });
 // oleadas
 if(gm=='s'&&!G.e.length&&--G.nw<=0){
  G.p.forEach(p=>{if(!p.dead){p.c+=G.w*5;p.hp=Math.min(p.mh,p.hp+p.mh*.25)}});
  G.w++;G.nw=120;
  const n=Math.min(4+G.w*2,45);
  for(let k=0;k<n;k++){const bg=G.w%5==0&&k<G.w/5,a=rnd()*6.283;
   G.e.push({id:++G.id,x:W/2+Math.cos(a)*600,y:H/2+Math.sin(a)*500,hp:bg?600+G.w*60:25+G.w*9,r:bg?26:13,
    sp:bg?.9:Math.min(.9+rnd()*.6+G.w*.03,2.6),d:bg?25:8+G.w/2,v:bg?30:2+(G.w/3|0),t:bg?1:0})}
 }
 G.e.forEach(e=>{const t=near(e);if(!t)return;const a=Math.atan2(t.y-e.y,t.x-e.x);
  e.x+=Math.cos(a)*e.sp;e.y+=Math.sin(a)*e.sp;
  if(t.iv<=0&&hyp(t.x-e.x,t.y-e.y)<e.r+14)harm(t,e.d,e.t?'g':'c')});
 // jefe: Sukuna (Heian)
 const b=G.b;
 if(b){
